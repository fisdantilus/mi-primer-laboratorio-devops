name: Pipeline DevSecOps Unificado - Nginx & Seguridad Avanzada

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

# OBLIGATORIO PARA COSIGN: Permisos para escribir en el registro y firmar con OpenID Connect
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  devsecops-ci:
    name: Integración Continua y Auditoría de Seguridad
    runs-on: ubuntu-24.04

    steps:
      # ==========================================
      # FASE 1: DESCARGA Y ANÁLISIS DE CÓDIGO
      # ==========================================
      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Descarga todo el historial, necesario para un escaneo de secretos efectivo

      # NUEVO: Escaneo de secretos en el código e historial de Git con Trufflehog (Simplificado)
      - name: Escanear Secretos Expuestos (TruffleHog)
        uses: trufflesecurity/trufflehog-enterprise-github-action@main

      # ==========================================
      # FASE 2: CONSTRUCCIÓN Y AUTENTICACIÓN
      # ==========================================
      # NUEVO: Nos logueamos en el registro de contenedores de GitHub (GHCR)
      - name: Autenticar en GitHub Packages (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen Docker de Nginx
        run: |
          echo "Compilando la imagen corporativa de Nginx con hardening..."
          # Convertimos el nombre del repositorio a minúsculas para cumplir con el estándar de Docker
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$REPO_LOWER:latest .
          # Creamos un tag local para el healthcheck
          docker tag ghcr.io/$REPO_LOWER:latest mi-nginx-empresa:latest

      # ==========================================
      # FASE 3: ESCANEO DE SEGURIDAD (VULNERABILIDADES)
      # ==========================================
      - name: Analizar seguridad de la imagen (Trivy)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: 'image'
          image-ref: 'mi-nginx-empresa:latest'
          format: 'table'
          exit-code: '0'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # ==========================================
      # FASE 4: VALIDACIÓN EN VIVO (HEALTHCHECK)
      # ==========================================
      - name: Levantar servidor y verificar estado
        run: |
          echo "Levantando el contenedor en el puerto 8080..."
          docker run -d --name servidor_prueba -p 8080:8080 mi-nginx-empresa:latest
          sleep 5
          echo "Haciendo una petición HTTP de prueba (curl)..."
          curl -sI http://localhost:8080 | grep -E "HTTP/1.1 200|HTTP/2 200"
          echo "¡El servidor web responde correctamente con código 200!"

      - name: Apagar y limpiar contenedor de pruebas
        if: always()
        run: |
          docker stop servidor_prueba || true
          docker rm servidor_prueba || true

      # ==========================================
      # FASE 5: PUBLICACIÓN Y FIRMA DIGITAL (NUEVO)
      # ==========================================
      # Si el Healthcheck ha ido bien, subimos la imagen definitiva al registro
      - name: Subir imagen segura a GHCR
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker push ghcr.io/$REPO_LOWER:latest

      # Instalamos la herramienta oficial de firma de la Linux Foundation (Cosign)
      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3.7.0

      # Firmamos la imagen usando criptografía basada en tu identidad de GitHub (Keyless signing)
      - name: Firmar digitalmente la imagen Docker (Cosign)
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes ghcr.io/$REPO_LOWER:latest
