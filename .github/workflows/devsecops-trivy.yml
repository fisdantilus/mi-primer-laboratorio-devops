name: DevSecOps - Linters y Analisis de Vulnerabilidades

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

jobs:
  seguridad-y-calidad:
    # Fijamos el runner a la versión estable actual de Ubuntu
    runs-on: ubuntu-24.04

    steps:
      # Paso 1: Descargar el código del repositorio (v5 nativa en Node 24)
      - name: Descargar repositorio
        uses: actions/checkout@v5

      # Paso 2: Comprobación de sintaxis (Linter) del Dockerfile
      - name: Validar sintaxis del Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: 'Dockerfile'
          no-fail: true # Te avisa de fallos de buenas prácticas sin romper el pipeline

      # Paso 3: Construir la imagen local para poder analizarla
      - name: Construir imagen Docker local
        run: |
          docker build -t mi-servidor-seguro:v1 .

      # Paso 4: Escaneo de vulnerabilidades y dependencias con TRIVY
      # Corregido: Usamos una versión estable y la acción correcta para imágenes locales
      - name: Analizar seguridad de la imagen (Trivy)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: 'image' # Especificamos explícitamente que escanee una imagen
          image-ref: 'mi-servidor-seguro:v1'
          format: 'table'
          exit-code: '0'     # Cambia a '1' si quieres que el pipeline falle si encuentra CVEs graves
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
