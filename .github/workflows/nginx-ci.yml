name: CI de Infraestructura - Servidor Web Nginx

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test-server:
    runs-on: ubuntu-26.04

    steps:
      # Paso 1: Descargar el código (Dockerfile y archivos de Nginx)
      - name: Descargar repositorio
        uses: actions/checkout@v5

      # Paso 2: Construye la imagen del servidor web
      - name: Construir imagen Docker de Nginx
        run: |
          echo "Compilando la imagen corporativa de Nginx..."
          # En un caso real con un Dockerfile en tu repo usarías:
          # docker build -t mi-nginx-empresa:latest .
          
          # Para que este ejemplo funcione ya mismo sin archivos, usaremos una oficial:
          docker pull nginx:alpine
          docker tag nginx:alpine mi-nginx-empresa:latest

      # Paso 3: Levanta el contenedor en el Runner para probarlo
      - name: Levantar servidor y verificar estado (Healthcheck)
        run: |
          echo "Levantando el contenedor en el puerto 8080..."
          docker run -d --name servidor_prueba -p 8080:80 mi-nginx-empresa:latest
          
          # Esperamos 5 segundos para dar margen al arranque de Nginx en la VM
          sleep 5
          
          echo "Haciendo una petición HTTP de prueba (curl)..."
          # Usamos flags seguros para validar el estado del servidor
          curl -sI http://localhost:8080 | grep -E "HTTP/1.1 200|HTTP/2 200"
          
          echo "¡El servidor web responde correctamente!"

      # Paso 4: Limpieza del entorno de pruebas
      # Añadimos 'always()' para que limpie el runner aunque el curl del paso anterior falle
      - name: Apagar y limpiar contenedor de pruebas
        if: always()
        run: |
          docker stop servidor_prueba || true
          docker rm servidor_prueba || true
